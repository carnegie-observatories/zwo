[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcamweb"
version = "0.1.0"
description = "gcam -> browser bridge: CHZ1 frame streaming and the web guider viewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "astropy",
    "chz1[stream]",
    "numpy",
    "zstandard",
]

[project.scripts]
gcamweb = "gcamweb.server:main"

# chz1 is unpublished; it is consumed from the astro-ph monorepo checkout, the
# same way the JS packages are (see README). Pin to a git ref when it publishes.
[tool.uv.sources]
chz1 = { path = "../../../astro-ph-labs/astro-ph/packages/chz1" }

[tool.hatch.build.targets.wheel]
packages = ["gcamweb"]
