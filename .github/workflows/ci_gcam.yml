name: CI - ZWO GCAM

on:
  workflow_dispatch:
  push:
    branches: [main, gh-action]
    paths:
      - src/gcam/**
      - src/cxt/**
      - Dockerfile.gcam
      - .github/workflows/ci_gcam.yml
      - etc/scripts/stamp-version.sh

  pull_request:
    branches: [main]
    paths:
      - src/gcam/**
      - src/cxt/**
      - Dockerfile.gcam
      - .github/workflows/ci_gcam.yml
      - etc/scripts/stamp-version.sh

  release:
    types: [published]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get artifact name
        id: get_artifact_name
        run: |
          short_sha=$(git rev-parse --short ${{ github.sha }})
          if [ -z "${{ github.event.release.tag_name }}" ]; then
            artifact_name=gcamzwo-${short_sha}.run
          else
            artifact_name=gcamzwo-${{ github.event.release.tag_name }}-${short_sha}.run
          fi
          echo artifact_name="$artifact_name" >> $GITHUB_OUTPUT
      - name: Stamp P_VERSION with version + commit hash
        run: |
          etc/scripts/stamp-version.sh src/gcam/zwogcam.h \
            "$(git rev-parse --short ${{ github.sha }})" \
            "${{ github.event.release.tag_name }}"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gcam
          tags: ghcr.io/carnegie-observatories/zwo-gcam:latest
      - name: Copy artifact file from container
        run: |
          docker run --name temp-container ghcr.io/carnegie-observatories/zwo-gcam:latest
          docker cp temp-container:/app/gcamzwo.run $GITHUB_WORKSPACE/${{ steps.get_artifact_name.outputs.artifact_name }}
          docker rm temp-container
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get_artifact_name.outputs.artifact_name }}
          include-hidden-files: true
          path: ${{ steps.get_artifact_name.outputs.artifact_name }}
          if-no-files-found: error
      - name: Upload artifact to release (if available)
        run: |
          if [ -z "${{ github.event.release.tag_name }}" ]; then
            echo "No release tag found, skipping release artifact upload"
          else
            cd $GITHUB_WORKSPACE
            gh release upload ${{github.event.release.tag_name}} ${{ steps.get_artifact_name.outputs.artifact_name }}
          fi

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get artifact name
        id: get_artifact_name
        run: |
          short_sha=$(git rev-parse --short ${{ github.sha }})
          if [ -z "${{ github.event.release.tag_name }}" ]; then
            artifact_name=gcamzwo-macos-${short_sha}.run
          else
            artifact_name=gcamzwo-macos-${{ github.event.release.tag_name }}-${short_sha}.run
          fi
          echo artifact_name="$artifact_name" >> $GITHUB_OUTPUT
      - name: Stamp P_VERSION with version + commit hash
        run: |
          etc/scripts/stamp-version.sh src/gcam/zwogcam.h \
            "$(git rev-parse --short ${{ github.sha }})" \
            "${{ github.event.release.tag_name }}"
      - name: Install dependencies (XQuartz for X11, makeself)
        run: |
          brew install --cask xquartz
          brew install makeself
      # The committed makefiles select the Linux toolchain; override the
      # variables on the command line instead of editing them.  XQuartz ships
      # universal libX11, so build a fat arm64+x86_64 binary.
      - name: Build cxt library
        working-directory: src/cxt/src
        run: |
          make clean
          make libcxt.a CC="/usr/bin/gcc -arch arm64 -arch x86_64" \
            CFLAGS="-DMACOSX -DNDEBUG -Wall -DFONTSIZE=18 -I/opt/X11/include"
      - name: Build gcam
        working-directory: src/gcam
        run: |
          make clean
          make CC="/usr/bin/gcc -arch arm64 -arch x86_64" \
            CFLAGS="-DMACOSX -DNDEBUG -Wall -I../cxt/src/ -I/opt/X11/include" \
            LIBS="" LIBX="-L../cxt/src/ -lcxt -L/opt/X11/lib -lX11"
          file gcamzwo getimages
      # Unlike the Linux installer this one does not extract into "/": on
      # macOS "/", "/usr" and the "/tmp" symlink live on the sealed system
      # volume, so tar cannot touch them even as root.  makeself extracts
      # into a temp dir and install.sh copies the binaries into
      # $PREFIX/bin (default /usr/local, needs sudo on Apple Silicon).
      - name: Make self-extracting installer
        run: |
          mkdir -p installer
          cp src/gcam/gcamzwo src/gcam/getimages installer/
          cat > installer/install.sh <<'EOS'
          #!/bin/bash
          set -e
          PREFIX="${PREFIX:-/usr/local}"
          if ! mkdir -p "$PREFIX/bin" 2>/dev/null || [ ! -w "$PREFIX/bin" ]; then
            echo "Cannot write to $PREFIX/bin: re-run with sudo, or set PREFIX=<dir>" >&2
            exit 1
          fi
          install -m 755 gcamzwo getimages "$PREFIX/bin/"
          echo "Installed gcamzwo and getimages into $PREFIX/bin"
          EOS
          chmod +x installer/install.sh
          makeself --nox11 installer ${{ steps.get_artifact_name.outputs.artifact_name }} "ZWO GCAM" ./install.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get_artifact_name.outputs.artifact_name }}
          include-hidden-files: true
          path: ${{ steps.get_artifact_name.outputs.artifact_name }}
          if-no-files-found: error
      - name: Upload artifact to release (if available)
        run: |
          if [ -z "${{ github.event.release.tag_name }}" ]; then
            echo "No release tag found, skipping release artifact upload"
          else
            cd $GITHUB_WORKSPACE
            gh release upload ${{github.event.release.tag_name}} ${{ steps.get_artifact_name.outputs.artifact_name }}
          fi
