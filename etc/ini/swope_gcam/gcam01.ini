# Swope guider 1: a ZWO ASI294MM-P on a Swope guider port, for the
# swap test of docs/ASI294MM-P_guider_swap_summary.md.  No TCSIS at
# Swope: start with -t 0 (the default).  Guide corrections go to the
# Swope TCS as G frames on gframe_port (src/gcam/gframe/README.md,
# docs/plans/gcam-swope-guiding.md).  Lines marked "measure" are first
# values until the camera is on the sky.
#
# the camera's Raspberry Pi: name to be given at deployment
host	swope-gcam01
name	Swope-G1
gnum	1
# gm1: guide on a field star
gmode	1
# mode 5: 2520x2520 binned 2 = 2.4' of the 2.78' illuminated patch
mode	5
# 2.3 um x bin 2 x 12.54"/mm = 58 mas (measure)
px	58
# camera x,y to the sky: no rotator, so a fixed angle (measure)
angle	0
elsign	0
rosign	0
parity	1
bx	41
exptime 0.5
# low to start; the TCS reads one G count as 0.05" (measure)
sn	0.3
# where the TCS connects (Swope.ini Guider_addr/Guider_port)
gframe_port	10001
gframe_period	1.5
